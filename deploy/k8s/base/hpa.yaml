apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smartlogistics-api
  labels:
    app.kubernetes.io/name: smartlogistics-api
    app.kubernetes.io/part-of: smartlogistics
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smartlogistics-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      # Scale down slowly. Each pod holds a database connection pool, so
      # flapping replicas churn connections on the managed database.
      stabilizationWindowSeconds: 300
