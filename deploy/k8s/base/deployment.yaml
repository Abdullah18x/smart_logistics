apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartlogistics-api
  labels:
    app.kubernetes.io/name: smartlogistics-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: smartlogistics
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the declared replica count during a rollout: new pods
      # must pass their readiness probe before an old one is taken away.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: smartlogistics-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartlogistics-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: smartlogistics
    spec:
      serviceAccountName: smartlogistics-api
      automountServiceAccountToken: false
      # Long enough for in-flight requests to finish. Uvicorn stops accepting new
      # connections on SIGTERM and drains the ones it has.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread across zones so losing one does not take the service with it.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: smartlogistics-api
      containers:
        - name: api
          # Overlays replace this with the registry image (ECR or ACR).
          image: smartlogistics-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: smartlogistics-api-config
            - secretRef:
                name: smartlogistics-api-secrets
          env:
            # The migration Job owns schema changes; replicas must not race it.
            - name: RUN_MIGRATIONS
              value: "false"
            - name: WAIT_FOR_DB
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # No CPU limit on purpose: throttling an async web process adds
              # tail latency without protecting anything the request already
              # reserves. Memory is capped because overrunning it is a leak.
              memory: 512Mi
          # Gives a slow first start all the time it needs without making the
          # liveness probe tolerant of a genuinely hung process later.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            # Liveness checks the process only. Were it to check Postgres, a
            # database blip would restart every pod and fix nothing.
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # This one does check Postgres, and answers 503 when it cannot reach
            # it, so an isolated pod leaves the load balancer instead of
            # collecting errors.
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The root filesystem is read-only, so give the process the one
            # writable path it may need.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
