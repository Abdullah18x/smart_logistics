# TEMPLATE ONLY — do not apply this file and do not commit real values.
#
# It is deliberately left out of kustomization.yaml so that `kubectl apply -k`
# cannot push placeholder credentials to a cluster.
#
# For a quick manual deploy, create the Secret from the command line so the
# values never touch the repository:
#
#   kubectl -n smartlogistics create secret generic smartlogistics-api-secrets \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://USER:PASSWORD@HOST:5432/smartlogistics' \
#     --from-literal=JWT_SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=REDIS_URL='redis://HOST:6379/0' \
#     --from-literal=MONGO_URI='mongodb+srv://...'
#
# For anything beyond a demo, do not manage this by hand. Install the External
# Secrets Operator and let the cluster pull from the platform's own store:
#   AWS   — Secrets Manager or SSM Parameter Store, reached through IRSA
#   Azure — Key Vault, reached through Workload Identity
# Both bind to the ServiceAccount in serviceaccount.yaml, so no static
# credential is stored in the cluster at all.
#
# The application refuses to start in staging or production if JWT_SECRET_KEY is
# left at its default, so a forgotten value fails loudly at rollout rather than
# quietly signing tokens with a key that is published in this repository.
apiVersion: v1
kind: Secret
metadata:
  name: smartlogistics-api-secrets
  namespace: smartlogistics
  labels:
    app.kubernetes.io/name: smartlogistics-api
    app.kubernetes.io/part-of: smartlogistics
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://REPLACE_ME:REPLACE_ME@REPLACE_ME:5432/smartlogistics"
  JWT_SECRET_KEY: "REPLACE_ME_WITH_openssl_rand_hex_32"
  REDIS_URL: "redis://REPLACE_ME:6379/0"
  MONGO_URI: "mongodb+srv://REPLACE_ME"
