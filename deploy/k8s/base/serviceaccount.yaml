# The pods run as this account rather than `default`.
#
# It carries no permissions: nothing in the API talks to the Kubernetes API. It
# exists so the cloud overlays can attach an identity to it — an IAM role on EKS
# or a managed identity on AKS — which is how a pod reaches Secrets Manager or
# Key Vault without a static credential anywhere in the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: smartlogistics-api
  labels:
    app.kubernetes.io/name: smartlogistics-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: smartlogistics
# No token is mounted: the pod never calls the Kubernetes API.
automountServiceAccountToken: false
