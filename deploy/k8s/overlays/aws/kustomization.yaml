# EKS.
#
#   aws ecr get-login-password --region eu-west-1 \
#     | docker login --username AWS --password-stdin 123456789012.dkr.ecr.eu-west-1.amazonaws.com
#   docker build -t 123456789012.dkr.ecr.eu-west-1.amazonaws.com/smartlogistics-api:v0.1.0 .
#   docker push  123456789012.dkr.ecr.eu-west-1.amazonaws.com/smartlogistics-api:v0.1.0
#   kubectl apply -k deploy/k8s/overlays/aws
#
# Replace the account id, region and hostname below before applying — every
# REPLACE_ME is a value only you have.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: smartlogistics

resources:
  - ../../base

images:
  - name: smartlogistics-api
    newName: REPLACE_ME.dkr.ecr.REPLACE_ME.amazonaws.com/smartlogistics-api
    # Pin a real tag. `latest` makes a rollout unreproducible and a rollback
    # meaningless, since both point at whatever was pushed last.
    newTag: v0.1.0

patches:
  - path: ingress-patch.yaml
  - path: serviceaccount-patch.yaml
