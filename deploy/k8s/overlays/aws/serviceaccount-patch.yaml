# IRSA: binds this ServiceAccount to an IAM role, so pods reach Secrets Manager,
# S3 or RDS IAM auth with short-lived credentials issued by STS. Nothing static
# is stored in the cluster.
#
#   eksctl create iamserviceaccount \
#     --cluster smartlogistics --namespace smartlogistics \
#     --name smartlogistics-api \
#     --attach-policy-arn arn:aws:iam::REPLACE_ME:policy/smartlogistics-secrets-read \
#     --approve
apiVersion: v1
kind: ServiceAccount
metadata:
  name: smartlogistics-api
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::REPLACE_ME:role/smartlogistics-api
