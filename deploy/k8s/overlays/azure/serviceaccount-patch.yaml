# Workload Identity: federates this ServiceAccount with a managed identity, so
# pods read Key Vault without a client secret.
#
#   az identity create -n smartlogistics-api -g REPLACE_ME
#   az identity federated-credential create \
#     --name smartlogistics-api --identity-name smartlogistics-api -g REPLACE_ME \
#     --issuer "$(az aks show -n smartlogistics -g REPLACE_ME --query oidcIssuerProfile.issuerUrl -o tsv)" \
#     --subject system:serviceaccount:smartlogistics:smartlogistics-api
apiVersion: v1
kind: ServiceAccount
metadata:
  name: smartlogistics-api
  labels:
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: REPLACE_ME
