[project]
name = "smart-logistics"
version = "0.2.0"
description = "SmartLogistics — microservices monorepo (workspace root, not a package)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "import-linter>=2.1",
]

[tool.uv]
# The root only ties the workspace together; it ships no code of its own.
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
sl-platform = { workspace = true }
identity-service = { workspace = true }
warehouse-service = { workspace = true }
inventory-service = { workspace = true }
shipment-service = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Generated by Alembic autogenerate.
"services/*/migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["sl_platform", "identity", "warehouse", "inventory", "shipment"]

# Service boundaries, enforced in CI (`make lint`). A service may import the
# platform library, never another service: data crosses only over HTTP or Kafka.
[tool.importlinter]
root_packages = ["sl_platform", "identity", "warehouse", "inventory", "shipment"]

[[tool.importlinter.contracts]]
name = "Services are independent of each other"
type = "independence"
modules = ["identity", "warehouse", "inventory", "shipment"]

[[tool.importlinter.contracts]]
name = "The platform library knows nothing about any service"
type = "forbidden"
source_modules = ["sl_platform"]
forbidden_modules = ["identity", "warehouse", "inventory", "shipment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q --strict-markers"
