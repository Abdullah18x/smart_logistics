[project]
name = "smart-logistics-be"
version = "0.1.0"
description = "SmartLogistics — Intelligent Supply Chain & Delivery Orchestration Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "motor>=3.6",
    "redis>=5.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The HTML template is a single string of markup and CSS; wrapping its lines
# would make the generated page harder to read, not the Python.
"scripts/html_template.py" = ["E501"]

[tool.pytest.ini_options]
# "." puts the repo root on the path so `tests.factories` resolves as a plugin.
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "slow: tests that open extra database connections (concurrency)",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
]
