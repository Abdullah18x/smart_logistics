apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData: {timeInterval: 10s}
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
  # Business KPIs read Analytics' rollups directly (read-only queries). Grafana
  # always runs in Docker, so it reaches the analytics database by its container name.
  - name: Analytics
    uid: analytics
    type: grafana-postgresql-datasource
    access: proxy
    url: analytics-db:5432
    user: analytics
    secureJsonData: {password: analytics}
    jsonData: {database: analytics, sslmode: disable, postgresVersion: 1600, timescaledb: false}
