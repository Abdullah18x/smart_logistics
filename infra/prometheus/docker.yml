# Generated layout — docker mode. Services run as containers; targets are their names.
# Ports: API /metrics on the API port; Kafka worker 91NN (local) / 9100; Celery worker
# 92NN (local) / 9100; Temporal SDK metrics of the orchestrator worker 9306 (local) / 9300.
global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files: ["/etc/prometheus/rules/*.yml"]

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["identity:8000"]
        labels: {service: identity}
      - targets: ["warehouse:8000"]
        labels: {service: warehouse}
      - targets: ["inventory:8000"]
        labels: {service: inventory}
      - targets: ["shipment:8000"]
        labels: {service: shipment}
      - targets: ["courier:8000"]
        labels: {service: courier}
      - targets: ["orchestrator:8000"]
        labels: {service: orchestrator}
      - targets: ["tracking:8000"]
        labels: {service: tracking}
      - targets: ["analytics:8000"]
        labels: {service: analytics}
      - targets: ["notification:8000"]
        labels: {service: notification}
  - job_name: worker
    static_configs:
      - targets: ["identity-worker:9100"]
        labels: {service: identity}
      - targets: ["warehouse-worker:9100"]
        labels: {service: warehouse}
      - targets: ["inventory-worker:9100"]
        labels: {service: inventory}
      - targets: ["shipment-worker:9100"]
        labels: {service: shipment}
      - targets: ["courier-worker:9100"]
        labels: {service: courier}
      - targets: ["orchestrator-worker:9100"]
        labels: {service: orchestrator}
      - targets: ["tracking-worker:9100"]
        labels: {service: tracking}
      - targets: ["analytics-worker:9100"]
        labels: {service: analytics}
      - targets: ["notification-worker:9100"]
        labels: {service: notification}
  - job_name: celery
    static_configs:
      - targets: ["inventory-celery:9100"]
        labels: {service: inventory}
      - targets: ["analytics-celery:9100"]
        labels: {service: analytics}
      - targets: ["notification-celery:9100"]
        labels: {service: notification}
  - job_name: temporal-sdk
    static_configs:
      - targets: ["orchestrator-worker:9300"]
        labels: {service: orchestrator}
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
