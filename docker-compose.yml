# SmartLogistics — microservices stack.
#
#   ./dev.sh docker up              signing key + databases, Kafka, gateway, 4 services + workers
#   ./dev.sh docker seed            development data
#   open http://localhost:8000/...  everything goes through the gateway
#   open http://localhost:8000/docs one Swagger UI for every service
#
# (Windows: .\dev.ps1 or dev instead of ./dev.sh)
#
# Each service owns an isolated Postgres instance (its own container, volume
# and credentials). No service can reach another's database; data crosses only
# through the gateway/HTTP and Kafka.
#
#   Gateway (Traefik)   http://localhost:8000      dashboard http://localhost:8080
#   Jaeger (traces)     http://localhost:16686
#   Kafka UI            http://localhost:8090      (profile: tools)
#   Services direct     identity 8001 · warehouse 8002 · inventory 8003 · shipment 8004

x-build: &build
  context: .
  dockerfile: infra/docker/service.Dockerfile

x-db-health: &db-health
  interval: 5s
  timeout: 5s
  retries: 12
  start_period: 10s

x-common-env: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  JWT_ISSUER: smartlogistics-identity
  JWT_AUDIENCE: smartlogistics

x-verifier-env: &verifier-env
  # Every service except Identity verifies tokens with Identity's public key,
  # fetched once from the JWKS endpoint and cached in each pod's memory.
  JWKS_URL: http://identity:8000/.well-known/jwks.json

x-db: &db
  image: postgres:16-alpine
  restart: unless-stopped
  mem_limit: 256m
  command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=60"]

services:
  # --- one database instance per service ---------------------------------------
  identity-db:
    <<: *db
    environment: {POSTGRES_USER: identity, POSTGRES_PASSWORD: identity, POSTGRES_DB: identity}
    ports: ["${IDENTITY_DB_PORT:-5441}:5432"]
    volumes: [identity-db:/var/lib/postgresql/data]
    healthcheck: {<<: *db-health, test: ["CMD-SHELL", "pg_isready -U identity -d identity"]}

  warehouse-db:
    <<: *db
    environment: {POSTGRES_USER: warehouse, POSTGRES_PASSWORD: warehouse, POSTGRES_DB: warehouse}
    ports: ["${WAREHOUSE_DB_PORT:-5442}:5432"]
    volumes: [warehouse-db:/var/lib/postgresql/data]
    healthcheck: {<<: *db-health, test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]}

  inventory-db:
    <<: *db
    environment: {POSTGRES_USER: inventory, POSTGRES_PASSWORD: inventory, POSTGRES_DB: inventory}
    ports: ["${INVENTORY_DB_PORT:-5443}:5432"]
    volumes: [inventory-db:/var/lib/postgresql/data]
    healthcheck: {<<: *db-health, test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]}

  shipment-db:
    <<: *db
    environment: {POSTGRES_USER: shipment, POSTGRES_PASSWORD: shipment, POSTGRES_DB: shipment}
    ports: ["${SHIPMENT_DB_PORT:-5444}:5432"]
    volumes: [shipment-db:/var/lib/postgresql/data]
    healthcheck: {<<: *db-health, test: ["CMD-SHELL", "pg_isready -U shipment -d shipment"]}

  # --- messaging -----------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    mem_limit: 768m
    ports: ["${KAFKA_HOST_PORT:-29092}:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are keyed by aggregate id; 3 partitions let 3 consumer pods share load.
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["tools"]
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: smartlogistics
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: {kafka: {condition: service_healthy}}

  # --- edge and observability ------------------------------------------------------
  gateway:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:8000
      - --api.dashboard=true
      - --api.insecure=true
    ports: ["${GATEWAY_PORT:-8000}:8000", "8080:8080"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]

  # The same edge for local development: `./dev.sh infra up` starts this one
  # instead, routing to the services running on your machine (infra/gateway/local.yml).
  gateway-local:
    image: traefik:v3.6
    profiles: ["local"]
    restart: unless-stopped
    command:
      - --providers.file.filename=/etc/traefik/local.yml
      - --entrypoints.web.address=:8000
      - --api.dashboard=true
      - --api.insecure=true
    ports: ["${GATEWAY_PORT:-8000}:8000", "8080:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./infra/gateway/local.yml:/etc/traefik/local.yml:ro"]
    depends_on: [docs]

  # One Swagger UI for every service, behind the gateway at /docs. A dropdown
  # switches between the specs each service serves (/openapi/<service>.json);
  # "Try it out" calls go through the gateway, and the token you authorise
  # with is remembered across services and reloads.
  docs:
    image: swaggerapi/swagger-ui:v5.17.14
    restart: unless-stopped
    environment:
      BASE_URL: /docs
      URLS: >-
        [{"name": "identity — auth & users", "url": "/openapi/identity.json"},
         {"name": "warehouse", "url": "/openapi/warehouse.json"},
         {"name": "inventory — catalog, stock & reservations", "url": "/openapi/inventory.json"},
         {"name": "shipment", "url": "/openapi/shipment.json"}]
      URLS_PRIMARY_NAME: identity — auth & users
      PERSIST_AUTHORIZATION: "true"
      DISPLAY_REQUEST_DURATION: "true"
      TRY_IT_OUT_ENABLED: "true"
      FILTER: "true"
    labels:
      traefik.enable: "true"
      traefik.http.routers.docs.rule: PathPrefix(`/docs`)
      traefik.http.routers.docs.entrypoints: web
      traefik.http.services.docs.loadbalancer.server.port: "8080"
      # http://localhost:8000 on its own opens the docs.
      traefik.http.routers.root.rule: Path(`/`)
      traefik.http.routers.root.entrypoints: web
      traefik.http.routers.root.service: docs
      traefik.http.routers.root.middlewares: root-to-docs
      traefik.http.middlewares.root-to-docs.redirectregex.regex: ^(https?://[^/]+)/$$
      traefik.http.middlewares.root-to-docs.redirectregex.replacement: $${1}/docs/

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    ports: ["16686:16686"]

  # --- identity --------------------------------------------------------------------
  identity:
    build: {<<: *build, args: {SERVICE: identity}}
    image: smartlogistics/identity:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://identity:identity@identity-db:5432/identity
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      JWT_KEY_ID: ${JWT_KEY_ID:-sl-1}
      WAREHOUSE_SERVICE_URL: http://warehouse:8000
      RUN_MIGRATIONS: "true"
    secrets: [jwt_private_key]
    ports: ["8001:8000"]
    depends_on: {identity-db: {condition: service_healthy}}
    labels:
      traefik.enable: "true"
      traefik.http.routers.identity.rule: PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/users`) || Path(`/.well-known/jwks.json`)
      traefik.http.routers.identity.entrypoints: web
      traefik.http.services.identity.loadbalancer.server.port: "8000"
      # Its spec, for the combined Swagger UI at http://localhost:8000/docs
      traefik.http.routers.identity-openapi.rule: Path(`/openapi/identity.json`)
      traefik.http.routers.identity-openapi.entrypoints: web
      traefik.http.routers.identity-openapi.service: identity
      traefik.http.routers.identity-openapi.middlewares: identity-openapi
      traefik.http.middlewares.identity-openapi.replacepath.path: /openapi.json

  identity-worker:
    image: smartlogistics/identity:${IMAGE_TAG:-local}
    restart: unless-stopped
    command: ["python", "-m", "identity.worker"]
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://identity:identity@identity-db:5432/identity
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
    secrets: [jwt_private_key]
    healthcheck: {disable: true}
    depends_on: {identity: {condition: service_healthy}, kafka: {condition: service_healthy}}

  # --- warehouse -------------------------------------------------------------------
  warehouse:
    build: {<<: *build, args: {SERVICE: warehouse}}
    image: smartlogistics/warehouse:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: [*common-env, *verifier-env]
      DATABASE_URL: postgresql+asyncpg://warehouse:warehouse@warehouse-db:5432/warehouse
      RUN_MIGRATIONS: "true"
    ports: ["8002:8000"]
    depends_on: {warehouse-db: {condition: service_healthy}}
    labels:
      traefik.enable: "true"
      traefik.http.routers.warehouse.rule: PathPrefix(`/api/v1/warehouses`)
      traefik.http.routers.warehouse.entrypoints: web
      traefik.http.services.warehouse.loadbalancer.server.port: "8000"
      # Its spec, for the combined Swagger UI at http://localhost:8000/docs
      traefik.http.routers.warehouse-openapi.rule: Path(`/openapi/warehouse.json`)
      traefik.http.routers.warehouse-openapi.entrypoints: web
      traefik.http.routers.warehouse-openapi.service: warehouse
      traefik.http.routers.warehouse-openapi.middlewares: warehouse-openapi
      traefik.http.middlewares.warehouse-openapi.replacepath.path: /openapi.json

  warehouse-worker:
    image: smartlogistics/warehouse:${IMAGE_TAG:-local}
    restart: unless-stopped
    command: ["python", "-m", "warehouse.worker"]
    environment:
      <<: [*common-env, *verifier-env]
      DATABASE_URL: postgresql+asyncpg://warehouse:warehouse@warehouse-db:5432/warehouse
    healthcheck: {disable: true}
    depends_on: {warehouse: {condition: service_healthy}, kafka: {condition: service_healthy}}

  # --- inventory -------------------------------------------------------------------
  inventory:
    build: {<<: *build, args: {SERVICE: inventory}}
    image: smartlogistics/inventory:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: [*common-env, *verifier-env]
      DATABASE_URL: postgresql+asyncpg://inventory:inventory@inventory-db:5432/inventory
      RUN_MIGRATIONS: "true"
    ports: ["8003:8000"]
    depends_on: {inventory-db: {condition: service_healthy}}
    labels:
      traefik.enable: "true"
      traefik.http.routers.inventory.rule: PathPrefix(`/api/v1/inventory`) || PathPrefix(`/api/v1/skus`)
      traefik.http.routers.inventory.entrypoints: web
      traefik.http.services.inventory.loadbalancer.server.port: "8000"
      # Its spec, for the combined Swagger UI at http://localhost:8000/docs
      traefik.http.routers.inventory-openapi.rule: Path(`/openapi/inventory.json`)
      traefik.http.routers.inventory-openapi.entrypoints: web
      traefik.http.routers.inventory-openapi.service: inventory
      traefik.http.routers.inventory-openapi.middlewares: inventory-openapi
      traefik.http.middlewares.inventory-openapi.replacepath.path: /openapi.json

  inventory-worker:
    image: smartlogistics/inventory:${IMAGE_TAG:-local}
    restart: unless-stopped
    command: ["python", "-m", "inventory.worker"]
    environment:
      <<: [*common-env, *verifier-env]
      DATABASE_URL: postgresql+asyncpg://inventory:inventory@inventory-db:5432/inventory
    healthcheck: {disable: true}
    depends_on: {inventory: {condition: service_healthy}, kafka: {condition: service_healthy}}

  # --- shipment --------------------------------------------------------------------
  shipment:
    build: {<<: *build, args: {SERVICE: shipment}}
    image: smartlogistics/shipment:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: [*common-env, *verifier-env]
      DATABASE_URL: postgresql+asyncpg://shipment:shipment@shipment-db:5432/shipment
      INVENTORY_SERVICE_URL: http://inventory:8000
      RUN_MIGRATIONS: "true"
    ports: ["8004:8000"]
    depends_on: {shipment-db: {condition: service_healthy}}
    labels:
      traefik.enable: "true"
      traefik.http.routers.shipment.rule: PathPrefix(`/api/v1/shipments`)
      traefik.http.routers.shipment.entrypoints: web
      traefik.http.services.shipment.loadbalancer.server.port: "8000"
      # Its spec, for the combined Swagger UI at http://localhost:8000/docs
      traefik.http.routers.shipment-openapi.rule: Path(`/openapi/shipment.json`)
      traefik.http.routers.shipment-openapi.entrypoints: web
      traefik.http.routers.shipment-openapi.service: shipment
      traefik.http.routers.shipment-openapi.middlewares: shipment-openapi
      traefik.http.middlewares.shipment-openapi.replacepath.path: /openapi.json

  shipment-worker:
    image: smartlogistics/shipment:${IMAGE_TAG:-local}
    restart: unless-stopped
    command: ["python", "-m", "shipment.worker"]
    environment:
      <<: [*common-env, *verifier-env]
      DATABASE_URL: postgresql+asyncpg://shipment:shipment@shipment-db:5432/shipment
    healthcheck: {disable: true}
    depends_on: {shipment: {condition: service_healthy}, kafka: {condition: service_healthy}}

secrets:
  jwt_private_key:
    file: ./infra/keys/jwt-private.pem

volumes:
  identity-db:
  warehouse-db:
  inventory-db:
  shipment-db:
  kafka-data:
